channels:
  - id: channel_1
    tiktok_username: "worldlife_ai"     # TikTok handle
    youtube_channel_name: "RZR"
    owner_email: "arifmehmood.bb@gmail.com"   # Gmail that owns the YouTube channel & GCP project
    google_credentials_file: "credentials/channel_1_client_secret.json"
    oauth_token_file: "tokens/channel_1_token.json"
    videos_per_day: 2
    description_footer: "#Shorts #Viral #TikTok"
    default_tags:
      - "Shorts"
      - "viral"
      - "funny"
      - "comedy"
    youtube_category_id: "22"           # 22=People & Blogs, 23=Comedy, 24=Entertainment
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: popular_split          # popular_split = Slot 1: Newest, Slot 2: Most Viewed
    max_download_candidates: 20
    # tiktok_username_slot2: "optional_secondary_tiktok"
    slot_publish_times_utc:
      1: "11:00"                        # 4:00 PM Pakistan Time (11:00 UTC)
      2: "16:00"                        # 9:00 PM Pakistan Time (16:00 UTC)
